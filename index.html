<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Fit Diary</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff7fa9">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#fff3f7;--card:#fff;--ink:#4a2f48;--muted:#9b7f97;--pink:#ff7fa9;--line:#f5d6e1;--danger:#e8577a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:ui-rounded,"Nunito",system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px}
.gate{background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:28px 22px;width:100%;max-width:340px;text-align:center;box-shadow:0 10px 30px -18px rgba(160,70,110,.5)}
h1{font-size:22px;margin:14px 0 4px}
p{color:var(--muted);margin:0 0 18px;font-size:14px}
input[type=password]{width:100%;font:inherit;font-size:28px;letter-spacing:10px;text-align:center;padding:12px;border:1.5px solid var(--line);border-radius:16px;background:#fffafc;color:var(--ink)}
input[type=password]:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px #ffe0ea}
button{margin-top:14px;width:100%;font:inherit;font-weight:800;font-size:16px;border:0;border-radius:999px;padding:12px;background:var(--pink);color:#fff;cursor:pointer;box-shadow:0 4px 0 #e5638f}
button:disabled{opacity:.6}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;font-size:14px;color:var(--muted)}
.err{color:var(--danger);font-weight:800;font-size:14px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<main class="gate" id="gate" hidden>
  <svg width="56" height="56" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="13" fill="#ff7fa9"/><path d="M20 30s-9-5.3-9-11.4A5 5 0 0 1 20 15a5 5 0 0 1 9 3.6C29 24.7 20 30 20 30z" fill="#fff"/></svg>
  <h1>Fit Diary</h1>
  <p>Enter your PIN to open.</p>
  <form id="f">
    <input type="password" id="pin" inputmode="numeric" autocomplete="current-password" aria-label="PIN" autofocus>
    <label><input type="checkbox" id="remember" checked> Remember on this device</label>
    <button id="go" type="submit">Unlock</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pin) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(LOCKED.salt), iterations: LOCKED.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(LOCKED.iv) }, key, b64d(LOCKED.data));
  let bytes = new Uint8Array(plain);
  if (LOCKED.gz && 'DecompressionStream' in window) bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  return new TextDecoder().decode(bytes);
}
function show(html) { document.open(); document.write(html); document.close(); }
(async () => {
  let saved = null; try { saved = localStorage.getItem('fd.pin'); } catch (e) {}
  if (saved) { try { show(await unlock(saved)); return; } catch (e) { try { localStorage.removeItem('fd.pin'); } catch (e2) {} } }
  document.getElementById('gate').hidden = false;
  document.getElementById('pin').focus();
  document.getElementById('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const pin = document.getElementById('pin').value.trim(), btn = document.getElementById('go'), err = document.getElementById('err');
    if (!pin) return;
    btn.disabled = true; btn.textContent = 'Unlocking…'; err.textContent = '';
    try {
      const html = await unlock(pin);
      if (document.getElementById('remember').checked) { try { localStorage.setItem('fd.pin', pin); } catch (e) {} }
      show(html);
    } catch (e) {
      err.textContent = 'That PIN didn’t work. Try again.';
      btn.disabled = false; btn.textContent = 'Unlock';
      document.getElementById('pin').select();
    }
  });
})();
